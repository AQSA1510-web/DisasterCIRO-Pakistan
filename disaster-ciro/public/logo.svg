<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background glow -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ff1a1a" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Middle ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#ff1a1a" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Lightning bolt / signal icon -->
  <path d="M108 40 L82 105 L98 105 L92 160 L118 95 L102 95 Z" 
        fill="#ff1a1a" 
        filter="url(#shadow)"/>
  
  <!-- Glow effect on bolt -->
  <path d="M108 40 L82 105 L98 105 L92 160 L118 95 L102 95 Z" 
        fill="none" 
        stroke="#ff1a1a" 
        stroke-width="2"
        stroke-opacity="0.5"/>
        
  <!-- Pulse dots -->
  <circle cx="100" cy="100" r="3" fill="#ff1a1a" opacity="0.8"/>
  <circle cx="140" cy="70" r="2" fill="#ff1a1a" opacity="0.4"/>
  <circle cx="60" cy="130" r="2" fill="#ff1a1a" opacity="0.4"/>
  <circle cx="150" cy="130" r="1.5" fill="#ff1a1a" opacity="0.3"/>
  <circle cx="50" cy="70" r="1.5" fill="#ff1a1a" opacity="0.3"/>
</svg>
